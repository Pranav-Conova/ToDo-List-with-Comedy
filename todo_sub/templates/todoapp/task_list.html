<!DOCTYPE html>
<html>
<head>
    <title>ToDo with Comedy</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e0f7fa;
            color: #333;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        h1 {
            color: #ff4081;
            text-align: center;
            animation: wobble 3s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        a {
            display: block;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: #00796b;
            text-decoration: none;
            font-weight: bold;
            position: relative;
            z-index: 2;
        }

        a:hover {
            text-decoration: underline;
        }

        ul {
            list-style-type: none;
            padding: 0;
            position: relative;
            z-index: 2;
        }

        li {
            background-color: #fff3e0;
            margin: 1rem auto;
            padding: 1rem;
            border-radius: 15px;
            width: 60%;
            box-shadow: 1px 1px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        li:hover {
            transform: scale(1.03);
        }

        strong {
            font-size: 1.2rem;
            color: #e65100;
        }

        em {
            display: block;
            margin-top: 0.5rem;
            color: #00838f;
            font-style: italic;
        }

        .emoji {
            position: absolute;
            font-size: 2rem;
            opacity: 0.7;
            animation: float 10s infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100vh) rotate(360deg); }
            100% { transform: translateY(0) rotate(720deg); }
        }

        @keyframes wobble {
            0% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg); }
            100% { transform: rotate(-1deg); }
        }
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            background-color: #fff;
            border: 2px solid #ff4081;
            padding: 9px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-block;
            position: relative;
            margin-right: 10px;
            transition: all 0.2s ease;
        }
        
        input[type="checkbox"]:checked {
            background-color: #ff4081;
            border-color: #ff4081;
        }
        
        input[type="checkbox"]:checked::after {
            content: '✔';
            color: #fff;
            font-size: 0.9rem;
            position: absolute;
            top: 0;
            left: 3px;
        }
        .action-button {
            display: inline-block;
            padding: 6px 14px;
            margin-top: 10px;
            font-size: 0.9rem;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        
        .edit-btn {
            background-color: #ffd54f;
            color: #5d4037;
        }
        
        .edit-btn:hover {
            background-color: #ffca28;
            transform: scale(1.05);
        }
        
        .delete-btn {
            background-color: #ef9a9a;
            color: #b71c1c;
        }
        
        .delete-btn:hover {
            background-color: #e57373;
            transform: scale(1.05);
        }
        
        
    </style>
</head>
<body>
    <h1>ToDo List with Comedy!</h1>
    <a href="{% url 'add_task' %}">➕ Add New Task</a>
    <ul>
        {% for task in tasks %}
            <li>
                <form method="post" action="{% url 'toggle_task' task.id %}" style="display:inline;">
                    {% csrf_token %}
                    <input type="checkbox" onchange="this.form.submit()" {% if task.is_done %}checked{% endif %}>
                </form>
    
                <strong style="{% if task.is_done %}text-decoration: line-through; opacity: 0.6;{% endif %}">
                    {{ task.title }}
                </strong> - {{ task.description }}<br>
                <em>{{ task.comedy_text }}</em><br>
    
                <!-- Edit and Delete Buttons -->
                <a href="{% url 'edit_task' task.id %}" class="action-button edit-btn">✏️ Edit</a>

                <form method="post" action="{% url 'delete_task' task.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="action-button delete-btn" onclick="return confirm('Delete this task? 🤔')">🗑️ Delete</button>
                </form>

            </li>
        {% endfor %}
    </ul>
    
    

    <script>
        const emojis = ['😂', '🧠', '📅', '🤡', '🎯', '💼', '🤣', '🥲'];
        const count = 25;

        for (let i = 0; i < count; i++) {
            const emoji = document.createElement('div');
            emoji.className = 'emoji';
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.top = Math.random() * 100 + 'vh';
            emoji.style.animationDuration = (5 + Math.random() * 10) + 's';
            emoji.style.fontSize = (1 + Math.random() * 2) + 'rem';

            document.body.appendChild(emoji);
        }

        // Optional: Rotate H1 messages for extra humor
        const funnyLines = [
            "😂 Task like a boss!",
            "😅 Procrastinate with style!",
            "📋 Fun never felt so productive!",
            "🎉 Comedy fuels efficiency!"
        ];

        let index = 0;
        setInterval(() => {
            const h1 = document.querySelector("h1");
            h1.innerText = funnyLines[index];
            index = (index + 1) % funnyLines.length;
        }, 4000);
    </script>
</body>
</html>
